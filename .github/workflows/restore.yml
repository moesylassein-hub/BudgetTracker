name: Restore verified Flutter source

on:
  push:
    paths:
      - ".github/workflows/restore.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify recovered project
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/part_* > /tmp/restored_source.b64
          echo "39b0c4ffe87a40d79022182accbdc77c343b8c226dccba7de2ada38682d2ea4d  /tmp/restored_source.b64" | sha256sum -c -
          base64 -d /tmp/restored_source.b64 > /tmp/restored_source.zip
          echo "33a04fd7aa24494dadb7fd659d5198025fd1fbd9f18610daf5972d05d77e105c  /tmp/restored_source.zip" | sha256sum -c -
          unzip -t /tmp/restored_source.zip
          unzip -oq /tmp/restored_source.zip -d .
          rm -rf .recovery

      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No restoration changes to commit."
            exit 0
          fi
          git commit -m "Restore complete Budget Tracker Flutter project"
          git push origin HEAD:main
